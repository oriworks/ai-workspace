# Renderizado com envsubst por scripts/cluster_start.sh
# As portas dos listeners correspondem às portas internas dos entrypoints do Traefik
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oriworks
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "*.${DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: "*.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ${TLS_SECRET}
      allowedRoutes:
        namespaces:
          from: All
    - name: mysql
      protocol: TCP
      port: 3306
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
